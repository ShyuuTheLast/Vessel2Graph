[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "VesselEMPy"
version = "0.3.0"
description = "Configuration-driven vessel skeleton, graph and instance segmentation pipeline"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<2", "scipy>=1.14,<1.15", "h5py>=3.11,<4", "networkx>=3.3,<4",
  "scikit-learn>=1.5,<1.6", "scikit-image==0.24.0", "PyYAML>=6,<7", "kimimaro==4.1.2", "cloud-volume==10.4.0",
  "psutil>=5",
  "edt==2.4.1", "connected-components-3d==3.18.0", "fill-voids==2.1.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
plot = ["matplotlib>=3.9,<4"]
view = ["neuroglancer==2.41.2"]

[project.scripts]
VesselEMPy = "VesselEMPy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
