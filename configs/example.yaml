# Copy to default.local.yaml and edit. Paths resolve from this file.
schema_version: 1
input:
  path: ../data/volume.h5
  dataset: main
  labels: [1]
  voxel_size_nm: [320, 256, 256]  # EXAMPLE ZYX nm; supply actual spacing.
output:
  directory: ../runs/dataset
skeleton:
  source: null
  method: thinning  # or kimimaro (uses teasar_params and crop_empty_border)
  thinning:
    closing_radius_nm: 0  # seal pores first; too large fuses neighbouring vessels
    fill_holes: true
    prune_factor: 1.5     # x local long half-width
    loop_factor: 3.0      # x 2*pi*radius
    min_loop_perimeter_nm: 70000  # smallest real vessel loop; 0 disables
  parallel: 1
resources:
  max_memory_gib: 16
  reserve_memory_gib: 2
hpc:  # used only by --slurm / --submit
  partition: bigmem
  cpus: 4
  mem_gib: null  # null requests max_memory_gib + reserve_memory_gib
  time: "1-00:00:00"  # keep quoted
estimation:
  sample_count: 1024
  erosion_steps: 16
  random_seed: 42
  coverage_quantile: 0.9
visualization:
  layers: [input_mask, skeleton_by_branch, junctions]
  hidden_layers: [input_mask, junctions]
  open_browser: false
