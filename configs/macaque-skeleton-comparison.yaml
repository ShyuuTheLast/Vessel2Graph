schema_version: 1
input:
  path: ../runs/macaque-closing-1024nm/estimation-volume-v2/prepared-mask.h5
  dataset: main
  labels:
  - 1
  voxel_size_nm:
  - 320
  - 256
  - 256
output:
  directory: ../runs/macaque-closing-1024nm-volume-estimated-v2
skeleton:
  source: null
  format: arrays
  teasar_params:
    scale: 2.7668182781209683
    const: 9649.594701928663
    pdrf_scale: 16384.0
    pdrf_exponent: 8
    soma_detection_threshold: .inf
    soma_acceptance_threshold: .inf
    soma_invalidation_scale: 2
    soma_invalidation_const: 300
    max_paths: null
  dust_threshold: 0
  parallel: 1
  fix_branching: true
  fix_borders: true
  crop_empty_border: true
graph:
  radius_clusters: 2
  random_seed: 42
  correct_branch_ends: true
segment:
  attribute: branch
  method: surface_chessboard
  surface_samples: 100
  query_batch_size: 100000
  read_slices: 8
  compression: gzip
resources:
  max_memory_gib: 16
  reserve_memory_gib: 2
estimation:
  erosion_steps: 16
  sample_count: 1024
  random_seed: 42
  coverage_quantile: 0.9
visualization:
  layers:
  - input_mask
  hidden_layers:
  - input_mask
  branch_volume: null
  caliber_volume: null
  radius_volume: null
  port: 0
  open_browser: true
  skeleton_overlays:
  - name: OLD - by branch (hole filled)
    path: ../runs/macaque-volume-estimated-v2/graph.npz
    mode: branch
    visible: true
  - name: NEW - by branch (4 voxel closing)
    path: ../runs/macaque-closing-1024nm-volume-estimated-v2/graph.npz
    mode: branch
    visible: true
